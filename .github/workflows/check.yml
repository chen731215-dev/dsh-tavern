name: 代码检查

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax-check:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查服务端语法
        run: npm run check

      - name: 检查客户端语法
        run: npm run check:client

      - name: 检查完成
        run: echo "✅ 所有语法检查通过！"
